name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Build Quartz
      - name: Install Quartz dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      # Build TurboWarp
      - name: Install TurboWarp dependencies
        working-directory: scratch-gui
        run: npm install

      - name: Build TurboWarp
        working-directory: scratch-gui
        run: NODE_ENV=production npm run build

      # Put TurboWarp at /turbowarp/
      - name: Copy TurboWarp into site
        run: |
          rm -rf public/turbowarp
          mkdir -p public/turbowarp
          cp -r scratch-gui/build/* public/turbowarp/

      # Upload complete website
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
